<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Attendance Taker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f5f5;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;

      background: white;

      padding: 32px;

      border-radius: 16px;

      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;

      text-align: center;

      font-size: 28px;

      color: #111;
    }

    .subtitle {
      margin: 0 0 30px;

      text-align: center;

      color: #666;

      font-size: 14px;

      line-height: 1.5;
    }

    .input-label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 600;

      color: #222;
    }

    .email-wrapper {
      display: flex;

      width: 100%;

      border: 1px solid #ccc;

      border-radius: 10px;

      overflow: hidden;

      background: white;
    }

    .email-wrapper:focus-within {
      border-color: #111;
    }

    #email {
      flex: 1;

      min-width: 0;

      border: none;

      outline: none;

      padding: 14px;

      font-size: 16px;

      color: #111;
    }

    #email::placeholder {
      color: #aaa;
    }

    .domain {
      display: flex;

      align-items: center;

      padding: 0 14px;

      background: #f1f1f1;

      color: #555;

      font-size: 14px;

      white-space: nowrap;
    }

    button {
      width: 100%;

      margin-top: 18px;

      padding: 14px;

      border: none;

      border-radius: 10px;

      background: #111;

      color: white;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      background: #999;

      cursor: not-allowed;
    }

    #message {
      margin-top: 22px;
    }

    .result {
      padding: 18px;

      border-radius: 12px;
    }

    .success {
      background: #eaf7ee;

      border: 1px solid #b9e2c4;
    }

    .warning {
      background: #fff7df;

      border: 1px solid #ead28a;
    }

    .error {
      background: #fdecec;

      border: 1px solid #e5b5b5;
    }

    .result-title {
      margin-bottom: 10px;

      font-size: 17px;

      font-weight: 700;
    }

    .student-info {
      color: #444;

      font-size: 14px;

      line-height: 1.7;
    }

    .next-text {
      margin-top: 12px;

      font-size: 13px;

      color: #666;
    }

    @media (max-width: 480px) {

      body {
        padding: 12px;

        align-items: flex-start;

        padding-top: 40px;
      }

      .container {
        padding: 24px 18px;
      }

      h1 {
        font-size: 24px;
      }

      .domain {
        padding: 0 10px;

        font-size: 13px;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <h1>Attendance Taker</h1>

    <p class="subtitle">
      Enter the student's KIET email to mark attendance
    </p>


    <label
      class="input-label"
      for="email"
    >
      KIET Email
    </label>


    <div class="email-wrapper">

      <input
        type="text"
        id="email"
        placeholder="student.25001234"
        autocomplete="off"
        autofocus
      >

      <span class="domain">
        @kiet.edu
      </span>

    </div>


    <button
      id="markButton"
      onclick="markPresent()"
    >
      Mark Present
    </button>


    <div id="message"></div>

  </div>


  <script>

    // ==========================================
    // PASTE YOUR APPS SCRIPT WEB APP URL HERE
    // ==========================================

    const API_URL = "https://script.google.com/macros/s/AKfycbxKzDiusqRZD3sNx7hXZb2uK84G0if1TpWo0sXpACI6DQWgjIk12bRD2hEOmEAuTOac/exec";


    const emailInput =
      document.getElementById("email");

    const markButton =
      document.getElementById("markButton");

    const message =
      document.getElementById("message");


    function markPresent() {

      const email =
        emailInput.value.trim();


      if (!email) {

        showError(
          "Please enter the student's KIET email."
        );

        emailInput.focus();

        return;
      }


      markButton.disabled = true;

      markButton.textContent = "Checking...";

      message.innerHTML = "";


      fetch(API_URL, {

        method: "POST",

        body: JSON.stringify({
          email: email
        })

      })

        .then(response => {

          if (!response.ok) {
            throw new Error("Request failed");
          }

          return response.json();

        })

        .then(result => {

          showResult(result);

        })

        .catch(error => {

          console.error(error);

          showServerError();

        });

    }


    function showResult(result) {

      markButton.disabled = false;

      markButton.textContent = "Mark Present";


      if (result.success) {

        message.innerHTML = `

          <div class="result success">

            <div class="result-title">
              ✓ Attendance Marked
            </div>

            <div class="student-info">

              <strong>
                ${escapeHtml(result.name)}
              </strong>

              <br>

              Roll Number:
              ${escapeHtml(result.rollNumber)}

              <br>

              ${escapeHtml(result.branch)}
              • Section
              ${escapeHtml(result.section)}

            </div>

            <div class="next-text">
              Ready for the next student.
            </div>

          </div>

        `;


        emailInput.value = "";

        emailInput.focus();

      }


      else if (result.alreadyPresent) {

        message.innerHTML = `

          <div class="result warning">

            <div class="result-title">
              ⚠ Already Present
            </div>

            <div class="student-info">

              <strong>
                ${escapeHtml(result.name)}
              </strong>

              is already marked present.

            </div>

          </div>

        `;


        emailInput.select();

        emailInput.focus();

      }


      else {

        showError(
          "Student not found. Please check the KIET email."
        );

        emailInput.select();

        emailInput.focus();

      }

    }


    function showError(text) {

      message.innerHTML = `

        <div class="result error">

          <div class="result-title">
            ✕ Error
          </div>

          <div class="student-info">
            ${escapeHtml(text)}
          </div>

        </div>

      `;


      markButton.disabled = false;

      markButton.textContent = "Mark Present";

    }


    function showServerError() {

      showError(
        "Something went wrong. Please try again."
      );

    }


    function escapeHtml(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value ?? "";

      return div.innerHTML;

    }


    emailInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          markPresent();

        }

      }
    );

  </script>

</body>

</html>
