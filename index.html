
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AptiQuest 3.0 - QR Attendance</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 24px auto;
      padding: 14px;
      background: #f1f5f9;
      color: #172033;
    }
    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px #0001;
    }
    header {
      padding: 24px;
      color: white;
      background: #193c70;
    }
    header h1 { margin: 8px 0; }
    main { padding: 22px; }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #1d4ed8;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .stop { background: #475569; }
    #reader { margin-top: 16px; }
    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }
    .info { background: #dbeafe; color: #1e40af; }
    .success { background: #dcfce7; color: #166534; }
    .error { background: #fee2e2; color: #991b1b; }
    .student { margin-top: 8px; }
  </style>
</head>

<body>
  <div class="card">
    <header>
      <div>APTIQUEST 3.0 · 2026</div>
      <h1>Attendance Portal</h1>
      <div>Enter KIET ID or scan student QR</div>
    </header>

    <main>
      <label for="kietId">KIET Mail ID</label>
      <input id="kietId" type="text"
        placeholder="Enter ID or full email"
        autocomplete="off" autocapitalize="none">

      <button id="submitBtn" onclick="submitEmail()">
        Verify ID &amp; Mark Present
      </button>

      <p style="text-align:center;margin-top:24px">OR SCAN QR CODE</p>

      <button id="startBtn" onclick="startScanner()">
        Start QR Scanner
      </button>

      <div id="reader"></div>

      <button id="stopBtn" class="stop"
        onclick="stopScanner()" hidden>
        Stop Scanner
      </button>

      <div id="status" class="info">Ready.</div>
    </main>
  </div>

  <script>
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzzL_ksIjLYgV4DxnKM01K5Uib1yMT8SsGKTvysqOpwnZWlbeZqEMtZCbfI93h1ohOGkg/exec";

    let scanner = null;
    let processing = false;

    function showStatus(message, type = "info", student = null) {
      const status = document.getElementById("status");
      status.className = type;
      status.replaceChildren();

      const messageLine = document.createElement("strong");
      messageLine.textContent = message;
      status.appendChild(messageLine);

      if (student) {
        const details = document.createElement("div");
        details.className = "student";

        const fields = [
          ["Name", student.name],
          ["Roll Number", student.roll],
          ["KIET Email", student.email],
          ["Stream", student.stream],
          ["Branch", student.branch],
          ["Section", student.section]
        ];

        fields.forEach(([label, value]) => {
          const line = document.createElement("div");
          line.textContent = label + ": " + (value || "Not available");
          details.appendChild(line);
        });

        if (student.timestamp) {
          const line = document.createElement("div");
          line.textContent = "Timestamp: " + student.timestamp;
          details.appendChild(line);
        }

        status.appendChild(details);
      }
    }

    function submitEmail() {
      const raw = document.getElementById("kietId").value.trim();

      if (!raw) {
        showStatus("Please enter your KIET ID.", "error");
        return;
      }

      const identifier = raw.includes("@") ? raw : raw + "@kiet.edu";
      sendAttendance(identifier, "email");
    }

    function sendAttendance(identifier, type) {
      if (processing) return;

      if (APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
        showStatus("Please set your Apps Script /exec URL in index.html.", "error");
        return;
      }

      processing = true;
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("startBtn").disabled = true;
      showStatus("Checking student and marking attendance...");

      const callbackName =
        "attendanceCallback_" + Date.now() + "_" +
        Math.floor(Math.random() * 1000000);

      const script = document.createElement("script");
      let finished = false;
      let timeoutId;

      function finish() {
        if (finished) return;
        finished = true;
        clearTimeout(timeoutId);
        delete window[callbackName];
        script.remove();
        processing = false;
        document.getElementById("submitBtn").disabled = false;
        document.getElementById("startBtn").disabled = false;
      }

      window[callbackName] = function(response) {
        finish();

        if (!response) {
          showStatus("No valid response from the attendance server.", "error");
          return;
        }

        let type = "error";
        if (response.success) type = "success";
        else if (response.code === "DUPLICATE") type = "info";

        showStatus(response.message || "Request completed.", type, response.student);

        if (response.success) {
          document.getElementById("kietId").value = "";
        }
      };

      script.onerror = function() {
        finish();
        showStatus("Could not contact Apps Script. Check deployment and URL.", "error");
      };

      const params = new URLSearchParams({
        action: "markAttendance",
        identifier: identifier,
        type: type,
        callback: callbackName
      });

      timeoutId = setTimeout(function() {
        finish();
        showStatus("Server timed out. Please retry.", "error");
      }, 25000);

      script.src = APPS_SCRIPT_URL + "?" + params.toString();
      document.body.appendChild(script);
    }

    function startScanner() {
      if (scanner || processing) return;

      if (typeof Html5QrcodeScanner === "undefined") {
        showStatus("Scanner library failed to load. Check your internet.", "error");
        return;
      }

      document.getElementById("startBtn").hidden = true;
      document.getElementById("stopBtn").hidden = false;
      showStatus("Tap Start Scanning inside the scanner panel.");

      scanner = new Html5QrcodeScanner("reader", {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        rememberLastUsedCamera: true,
        supportedScanTypes: [
          Html5QrcodeScanType.SCAN_TYPE_CAMERA,
          Html5QrcodeScanType.SCAN_TYPE_FILE
        ]
      }, false);

      scanner.render(async function(decodedText) {
        if (processing) return;

        const identifier = String(decodedText || "").trim();
        if (!identifier) return;

        await stopScanner();

        sendAttendance(
          identifier,
          identifier.includes("@") ? "email" : "qr"
        );
      }, function() {
        // Ignore normal frames without a QR code.
      });
    }

    async function stopScanner() {
      if (scanner) {
        const current = scanner;
        scanner = null;

        try {
          await current.clear();
        } catch (error) {
          console.warn("Scanner cleanup:", error);
        }
      }

      document.getElementById("startBtn").hidden = false;
      document.getElementById("stopBtn").hidden = true;
    }
  </script>
</body>
</html>
